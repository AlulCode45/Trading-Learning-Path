services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: tlp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tlp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tlp_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-tlp_trading_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tlp_user} -d ${POSTGRES_DB:-tlp_trading_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # TraderLearning-Path API & App Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tlp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_DIALECT: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-tlp_user}:${POSTGRES_PASSWORD:-tlp_secret_password}@postgres:5432/${POSTGRES_DB:-tlp_trading_db}
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
    driver: local
